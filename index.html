<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Create a 3d calculator - 3D WebGL</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
body { background: #030712; color: #fff; font-family: 'Segoe UI', system-ui, sans-serif; overflow: hidden; width: 100vw; height: 100vh; touch-action: none; }
#canvas3d { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 1; }
#hud { position: fixed; top: 16px; left: 16px; right: 16px; display: flex; justify-content: space-between; align-items: center; z-index: 10; pointer-events: none; max-width: 600px; margin: 0 auto; }
.hud-box { background: rgba(15, 23, 42, 0.82); backdrop-filter: blur(12px); border: 1px solid rgba(56, 189, 248, 0.4); padding: 10px 16px; border-radius: 14px; box-shadow: 0 0 25px rgba(6, 182, 212, 0.25); }
.hud-label { font-size: 10px; font-weight: 800; color: #94a3b8; letter-spacing: 1.5px; text-transform: uppercase; }
.hud-val { font-size: 22px; font-weight: 900; color: #38bdf8; text-shadow: 0 0 12px rgba(56, 189, 248, 0.6); }
#nitroWrap { position: fixed; top: 82px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 560px; height: 8px; background: rgba(255,255,255,0.12); border-radius: 4px; overflow: hidden; z-index: 10; pointer-events: none; }
#nitroFill { width: 100%; height: 100%; background: linear-gradient(90deg, #06b6d4, #ec4899, #f59e0b); box-shadow: 0 0 15px #ec4899; transition: width 0.08s; }
#controls { position: fixed; bottom: 26px; left: 16px; right: 16px; display: flex; justify-content: space-between; align-items: center; z-index: 15; max-width: 560px; margin: 0 auto; }
.ctrl-btn { width: 78px; height: 78px; border-radius: 50%; background: rgba(15, 23, 42, 0.85); border: 2px solid rgba(56, 189, 248, 0.5); backdrop-filter: blur(10px); color: #fff; font-size: 28px; font-weight: 900; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 25px rgba(0,0,0,0.6); cursor: pointer; }
.ctrl-btn:active { background: rgba(56, 189, 248, 0.45); transform: scale(0.93); }
.nitro-btn { width: 110px; height: 64px; border-radius: 32px; background: linear-gradient(135deg, #ec4899, #f43f5e); border: 2px solid #fda4af; font-size: 15px; letter-spacing: 1px; box-shadow: 0 0 25px rgba(236, 72, 153, 0.6); }
#modal { position: fixed; inset: 0; background: radial-gradient(circle at center, rgba(15,23,42,0.88), rgba(3,7,18,0.97)); backdrop-filter: blur(14px); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 30; padding: 24px; text-align: center; }
#modal h1 { font-size: 38px; font-weight: 900; background: linear-gradient(135deg, #38bdf8, #ec4899, #fbbf24); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 10px; }
#modal p { color: #cbd5e1; font-size: 15px; max-width: 360px; line-height: 1.6; margin-bottom: 28px; }
#startBtn { background: linear-gradient(135deg, #06b6d4, #2563eb); color: #fff; border: 2px solid #7dd3fc; padding: 16px 48px; font-size: 19px; font-weight: 900; border-radius: 50px; cursor: pointer; text-transform: uppercase; letter-spacing: 2px; box-shadow: 0 0 35px rgba(6, 182, 212, 0.7); transition: 0.2s; }
#startBtn:active { transform: scale(0.95); }
</style>
</head>
<body>
<canvas id="canvas3d"></canvas>
<div id="hud">
    <div class="hud-box"><div class="hud-label">Score</div><div class="hud-val" id="scoreEl">0</div></div>
    <div class="hud-box"><div class="hud-label">Best</div><div class="hud-val" id="bestEl">0</div></div>
    <div class="hud-box"><div class="hud-label">Speed</div><div class="hud-val"><span id="speedEl">120</span> <small style="font-size:12px;">KM/H</small></div></div>
</div>
<div id="nitroWrap"><div id="nitroFill"></div></div>
<div id="controls">
    <div class="ctrl-btn" id="btnLeft">◀</div>
    <div class="ctrl-btn nitro-btn" id="btnNitro">NITRO ⚡</div>
    <div class="ctrl-btn" id="btnRight">▶</div>
</div>
<div id="modal">
    <h1 id="modalTitle">Create a 3d calculator</h1>
    <p id="modalDesc">Real-Time 3D WebGL Engine • Dynamic Lighting • 60FPS Physics • Procedural Audio<br>Steer with Touch Buttons or Arrow/WASD keys.</p>
    <button id="startBtn">START 3D RACE</button>
</div>

<script>
// ==================== WEB AUDIO SYNTHESIZER ====================
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
function sfx(type, speedRatio = 1) {
    try {
        if (!audioCtx) audioCtx = new AudioCtx();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;
        if (type === 'engine') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(55 + speedRatio * 95, now);
            gain.gain.setValueAtTime(0.035, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
            osc.start(now); osc.stop(now + 0.09);
        } else if (type === 'nitro') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(180, now);
            osc.frequency.exponentialRampToValueAtTime(720, now + 0.35);
            gain.gain.setValueAtTime(0.14, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
            osc.start(now); osc.stop(now + 0.35);
        } else if (type === 'crash') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(140, now);
            osc.frequency.exponentialRampToValueAtTime(28, now + 0.55);
            gain.gain.setValueAtTime(0.28, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.55);
            osc.start(now); osc.stop(now + 0.55);
        }
    } catch(e) {}
}

// ==================== THREE.JS 3D WEBGL ENGINE ====================
const canvas = document.getElementById('canvas3d');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x040814);
scene.fog = new THREE.FogExp2(0x040814, 0.012);

const camera = new THREE.PerspectiveCamera(62, window.innerWidth / window.innerHeight, 0.1, 300);
camera.position.set(0, 4.2, 9.5);
camera.lookAt(0, 1.0, -15);

// Lights
const ambLight = new THREE.AmbientLight(0x38bdf8, 0.65);
scene.add(ambLight);
const dirLight = new THREE.DirectionalLight(0xffffff, 1.1);
dirLight.position.set(15, 30, 20);
scene.add(dirLight);

// 3D Highway Road & Neon Grid
const roadGeo = new THREE.PlaneGeometry(18, 400);
const roadMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.7, metalness: 0.2 });
const road = new THREE.Mesh(roadGeo, roadMat);
road.rotation.x = -Math.PI / 2;
road.position.z = -150;
scene.add(road);

// Glowing Neon Side Rails
const railGeo = new THREE.BoxGeometry(0.35, 0.5, 400);
const leftRailMat = new THREE.MeshBasicMaterial({ color: 0x06b6d4 });
const rightRailMat = new THREE.MeshBasicMaterial({ color: 0xec4899 });
const leftRail = new THREE.Mesh(railGeo, leftRailMat);
leftRail.position.set(-9, 0.25, -150);
const rightRail = new THREE.Mesh(railGeo, rightRailMat);
rightRail.position.set(9, 0.25, -150);
scene.add(leftRail, rightRail);

// Moving Lane Stripes
const stripes = [];
const stripeGeo = new THREE.PlaneGeometry(0.25, 4.5);
const stripeMat = new THREE.MeshBasicMaterial({ color: 0xf8fafc });
for (let z = 10; z > -260; z -= 12) {
    [-3, 3].forEach(xPos => {
        const s = new THREE.Mesh(stripeGeo, stripeMat);
        s.rotation.x = -Math.PI / 2;
        s.position.set(xPos, 0.03, z);
        scene.add(s);
        stripes.push(s);
    });
}

// 3D Cyberpunk City Skyscrapers along the highway
const buildings = [];
const bColors = [0x0284c7, 0x9333ea, 0xe11d48, 0x0d9488];
for (let i = 0; i < 45; i++) {
    const h = 8 + Math.random() * 28;
    const w = 4 + Math.random() * 5;
    const bGeo = new THREE.BoxGeometry(w, h, w);
    const bMat = new THREE.MeshStandardMaterial({
        color: 0x090d16,
        emissive: bColors[i % bColors.length],
        emissiveIntensity: 0.22,
        roughness: 0.4
    });
    const b = new THREE.Mesh(bGeo, bMat);
    const side = i % 2 === 0 ? -1 : 1;
    b.position.set(side * (14 + Math.random() * 14), h / 2, -i * 6.5);
    scene.add(b);
    buildings.push(b);
}

// Helper to build a 3D Sports Car Mesh
function createCarMesh(hexColor, isPlayer = false) {
    const group = new THREE.Group();
    // Main Chassis
    const bodyGeo = new THREE.BoxGeometry(2.1, 0.65, 4.2);
    const bodyMat = new THREE.MeshStandardMaterial({ color: hexColor, metalness: 0.6, roughness: 0.25 });
    const body = new THREE.Mesh(bodyGeo, bodyMat);
    body.position.y = 0.55;
    group.add(body);

    // Cabin / Glass
    const cabGeo = new THREE.BoxGeometry(1.65, 0.52, 2.1);
    const cabMat = new THREE.MeshStandardMaterial({ color: 0x020617, metalness: 0.9, roughness: 0.1 });
    const cab = new THREE.Mesh(cabGeo, cabMat);
    cab.position.set(0, 1.05, -0.2);
    group.add(cab);

    // Spoiler
    const spGeo = new THREE.BoxGeometry(2.0, 0.12, 0.45);
    const sp = new THREE.Mesh(spGeo, bodyMat);
    sp.position.set(0, 1.05, 1.85);
    group.add(sp);

    // 4 Wheels
    const wheelGeo = new THREE.CylinderGeometry(0.42, 0.42, 0.35, 16);
    const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111827, roughness: 0.8 });
    [[-1.05, 0.42, 1.3], [1.05, 0.42, 1.3], [-1.05, 0.42, -1.3], [1.05, 0.42, -1.3]].forEach(pos => {
        const w = new THREE.Mesh(wheelGeo, wheelMat);
        w.rotation.z = Math.PI / 2;
        w.position.set(...pos);
        group.add(w);
    });

    // Glowing Tail/Headlights
    const lightGeo = new THREE.BoxGeometry(0.45, 0.2, 0.1);
    const tailMat = new THREE.MeshBasicMaterial({ color: isPlayer ? 0xff0055 : 0xfbbf24 });
    const tl1 = new THREE.Mesh(lightGeo, tailMat);
    tl1.position.set(-0.65, 0.6, 2.11);
    const tl2 = new THREE.Mesh(lightGeo, tailMat);
    tl2.position.set(0.65, 0.6, 2.11);
    group.add(tl1, tl2);

    return group;
}

const playerCar = createCarMesh(0x06b6d4, true);
scene.add(playerCar);

const playerGlow = new THREE.PointLight(0x06b6d4, 2.5, 12);
playerGlow.position.set(0, 1.5, 0);
playerCar.add(playerGlow);

// Game State
let running = false;
let score = 0;
let bestScore = parseInt(localStorage.getItem('best3d_race') || '0', 10);
document.getElementById('bestEl').innerText = bestScore;
let speed = 1.05;
let nitro = 100;
let isNitro = false;
let playerX = 0;
let keys = {};
let traffic = [];
const lanes = [-6, -2, 2, 6];
const enemyColors = [0xf43f5e, 0xa855f7, 0xf59e0b, 0x10b981, 0x3b82f6];

function spawnEnemy() {
    if (!running) return;
    const laneX = lanes[Math.floor(Math.random() * lanes.length)];
    const col = enemyColors[Math.floor(Math.random() * enemyColors.length)];
    const mesh = createCarMesh(col, false);
    mesh.position.set(laneX, 0, -180 - Math.random() * 40);
    scene.add(mesh);
    traffic.push({ mesh, speed: 0.45 + Math.random() * 0.35 });
}
setInterval(spawnEnemy, 900);

// Controls Binding
window.addEventListener('keydown', e => {
    keys[e.key] = true;
    if (e.key === ' ' || e.key === 'Shift') setNitro(true);
});
window.addEventListener('keyup', e => {
    keys[e.key] = false;
    if (e.key === ' ' || e.key === 'Shift') setNitro(false);
});

function bindTouch(id, keyName) {
    const btn = document.getElementById(id);
    const down = e => { e.preventDefault(); keys[keyName] = true; };
    const up = e => { e.preventDefault(); keys[keyName] = false; };
    btn.addEventListener('touchstart', down, { passive: false });
    btn.addEventListener('touchend', up, { passive: false });
    btn.addEventListener('mousedown', down);
    btn.addEventListener('mouseup', up);
    btn.addEventListener('mouseleave', up);
}
bindTouch('btnLeft', 'ArrowLeft');
bindTouch('btnRight', 'ArrowRight');

const btnNitro = document.getElementById('btnNitro');
btnNitro.addEventListener('touchstart', e => { e.preventDefault(); setNitro(true); }, { passive: false });
btnNitro.addEventListener('touchend', e => { e.preventDefault(); setNitro(false); }, { passive: false });
btnNitro.addEventListener('mousedown', () => setNitro(true));
btnNitro.addEventListener('mouseup', () => setNitro(false));

function setNitro(active) {
    if (active && nitro > 12) {
        isNitro = true;
        sfx('nitro');
    } else {
        isNitro = false;
    }
}

document.getElementById('startBtn').addEventListener('click', () => {
    // Clear existing traffic
    traffic.forEach(t => scene.remove(t.mesh));
    traffic = [];
    score = 0;
    speed = 1.1;
    nitro = 100;
    isNitro = false;
    playerX = 0;
    playerCar.position.set(0, 0, 0);
    document.getElementById('scoreEl').innerText = '0';
    document.getElementById('modal').style.display = 'none';
    running = true;
    sfx('nitro');
});

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

// Main 60FPS 3D Render Loop
function animate() {
    requestAnimationFrame(animate);

    if (running) {
        const curSpeed = isNitro ? speed * 1.9 : speed;
        if (Math.random() < 0.22) sfx('engine', curSpeed);

        // Steering & 3D Body Roll
        let steer = 0;
        if ((keys['ArrowLeft'] || keys['a'] || keys['A']) && playerX > -7.2) {
            playerX -= 0.22;
            steer = 0.14;
        }
        if ((keys['ArrowRight'] || keys['d'] || keys['D']) && playerX < 7.2) {
            playerX += 0.22;
            steer = -0.14;
        }
        playerCar.position.x += (playerX - playerCar.position.x) * 0.25;
        playerCar.rotation.z += (steer - playerCar.rotation.z) * 0.2;
        playerCar.rotation.y = steer * 0.4;

        // Dynamic Camera Follow & Nitro FOV Warp
        camera.position.x += (playerCar.position.x * 0.55 - camera.position.x) * 0.12;
        const targetFov = isNitro ? 82 : 62;
        camera.fov += (targetFov - camera.fov) * 0.1;
        camera.updateProjectionMatrix();

        // Nitro Bar
        if (isNitro) {
            nitro = Math.max(0, nitro - 0.65);
            if (nitro <= 0) isNitro = false;
        } else {
            nitro = Math.min(100, nitro + 0.18);
        }
        document.getElementById('nitroFill').style.width = nitro + '%';

        // Move Road Stripes
        stripes.forEach(s => {
            s.position.z += curSpeed * 2.2;
            if (s.position.z > 12) s.position.z -= 260;
        });

        // Move 3D Skyscrapers
        buildings.forEach(b => {
            b.position.z += curSpeed * 1.8;
            if (b.position.z > 20) b.position.z -= 290;
        });

        // Move & Collide Traffic Cars
        for (let i = traffic.length - 1; i >= 0; i--) {
            const t = traffic[i];
            t.mesh.position.z += (curSpeed - t.speed) * 2.1;

            // 3D Bounding Box Collision
            const dx = Math.abs(playerCar.position.x - t.mesh.position.x);
            const dz = Math.abs(playerCar.position.z - t.mesh.position.z);
            if (dx < 1.85 && dz < 3.7) {
                sfx('crash');
                running = false;
                if (score > bestScore) {
                    bestScore = score;
                    localStorage.setItem('best3d_race', bestScore);
                    document.getElementById('bestEl').innerText = bestScore;
                }
                document.getElementById('modalTitle').innerText = 'CRASHED!';
                document.getElementById('modalDesc').innerHTML = 'High-speed impact on the 3D highway!<br>Final Score: <b style="color:#38bdf8;font-size:22px;">' + score + '</b>';
                document.getElementById('startBtn').innerText = 'RACE AGAIN';
                document.getElementById('modal').style.display = 'flex';
                break;
            }

            if (t.mesh.position.z > 15) {
                scene.remove(t.mesh);
                traffic.splice(i, 1);
                score += isNitro ? 25 : 10;
                speed = Math.min(2.2, speed + 0.012);
                document.getElementById('scoreEl').innerText = score;
                document.getElementById('speedEl').innerText = Math.round(curSpeed * 145);
            }
        }
    }

    renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
